<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6b45">
  <title>PyInsect Data Collector</title>
  <meta name="apple-mobile-web-app-title" content="Data Collector">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <!-- Same fonts as the website. sw.js saves them for offline use. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
  <!-- Bump ?v= whenever app.js or style.css changes, so phones load the new copy instead of a cached one. -->
  <link rel="stylesheet" href="style.css?v=11">
  <script src="jszip.min.js"></script>
  <script src="app.js?v=22" defer></script>
</head>
<body>

<!-- ============ INTRO ============ -->
<main id="screen-intro" class="screen active">
  <div class="glass-card">
  <header class="brand">
    <h1><img src="logo.png" width="720" height="720" alt="Pyinsect Insect Data Collector"></h1>
  </header>

  <ol class="steps">
    <li><b>1</b><span>Put the insect on the turntable, type its name and press Start.</span></li>
    <li><b>2</b><span>Hold the bug in the ring. The camera finds it, takes the photos and zooms each one in on it.</span></li>
    <li><b>3</b><span>The photos are sent to the computer by themselves.</span></li>
  </ol>

  <div class="launch">
    <label class="field">Insect name
      <input id="insect-name" type="text" placeholder="e.g. ladybug" autocomplete="off" autocapitalize="none" maxlength="60">
    </label>
    <button id="capture" class="primary big">Start</button>
    <details class="calibrate">
      <summary>Settings</summary>
      <label class="field">Photos to take
        <input id="photo-count" type="number" inputmode="numeric" min="1" max="100" value="20">
      </label>
    </details>
  </div>
  </div>
</main>

<!-- ============ CAPTURE ============ -->
<main id="screen-camera" class="screen camera">
  <div id="light-overlay" aria-hidden="true"></div>
  <div id="preview" class="preview"><video id="video" playsinline muted autoplay></video></div>
  <div id="frame-guide" class="frame-guide" aria-hidden="true"></div>

  <section class="panel run">
    <p id="hud-count" class="hud-main">Photos taken: 0</p>
    <div class="bar"><div id="hud-bar"></div></div>
    <p id="hud-sub" class="hud-sub">Starting camera…</p>
  </section>
</main>

<!-- ============ SEND ============ -->
<main id="screen-send" class="screen">
  <div class="glass-card">
  <h1 id="send-title">Sending</h1>
  <h2>Computers</h2>
  <div id="rig-list" class="rig-list"></div>
  <p id="save-status" class="hint" role="status"></p>
  <div class="send-foot">
    <p id="send-pill" class="send-pill">Auto sends</p>
    <!-- Only shows if no computer answers, so the photos are never stuck -->
    <button id="save-zip" class="secondary wide" type="button" hidden>Save to phone instead</button>
  </div>
  </div>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
