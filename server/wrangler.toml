# Innvadex game server (see README.md). Deploy: npx wrangler@4.151.1 deploy
name = "innvadex-server"
main = "index.js"
compatibility_date = "2026-10-01"

# The lobby: one Durable Object (SQLite storage, the kind the free plan allows)
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

# Sign in with Google: the "Client ID" from Google Cloud (see README.md). It's not a secret.
# Empty = no Google button on the site.
[vars]
GOOGLE_CLIENT_ID = "976240104613-ek7m43557det89c7m77notv29k4h2986.apps.googleusercontent.com"
