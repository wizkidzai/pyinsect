<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14241b">
  <title>PyInsect Data Collector</title>
  <meta name="apple-mobile-web-app-title" content="Data Collector">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <!-- Bump ?v= whenever app.js or style.css changes, so phones load the new copy instead of a cached one. -->
  <link rel="stylesheet" href="style.css?v=9">
  <script src="jszip.min.js"></script>
  <script src="app.js?v=18" defer></script>
</head>
<body>

<!-- ============ INTRO ============ -->
<main id="screen-intro" class="screen active">
  <header class="hero">
    <h1>PyInsect Data Collector</h1>
  </header>

  <ol class="steps">
    <li><b>1</b>Put the insect on the turntable, type its name and press Start.</li>
    <li><b>2</b>Hold the bug in the ring while the photos are taken.</li>
    <li><b>3</b>The photos are sent to the computer by themselves.</li>
  </ol>

  <div class="launch">
    <label class="field">Insect name
      <input id="insect-name" type="text" placeholder="e.g. ladybug" autocomplete="off" autocapitalize="none" maxlength="60">
    </label>
    <button id="capture" class="primary big">Start</button>
  </div>
</main>

<!-- ============ CAPTURE ============ -->
<main id="screen-camera" class="screen camera">
  <div id="light-overlay" aria-hidden="true"></div>
  <div id="preview" class="preview"><video id="video" playsinline muted autoplay></video></div>
  <div id="frame-guide" class="frame-guide" aria-hidden="true"></div>

  <section class="panel run">
    <p id="hud-count" class="hud-main">Photos taken: 0</p>
    <div class="bar"><div id="hud-bar"></div></div>
    <p id="hud-sub" class="hud-sub">Starting camera…</p>
  </section>
</main>

<!-- ============ SEND ============ -->
<main id="screen-send" class="screen">
  <h1 id="send-title">Sending</h1>
  <h2>Computers</h2>
  <div id="rig-list" class="rig-list"></div>
  <p id="save-status" class="hint" role="status"></p>
  <div class="send-foot">
    <p id="send-pill" class="send-pill">Auto sends</p>
    <!-- Only shows if no computer answers, so the photos are never stuck -->
    <button id="save-zip" class="secondary wide" type="button" hidden>Save to phone instead</button>
  </div>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
